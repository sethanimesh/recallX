<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf6eb"/>
      <stop offset="100%" stop-color="#f0e4d2"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4935e"/>
      <stop offset="100%" stop-color="#a06030"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#8a5020" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bgB)"/>
  <!-- decorative dashed circles -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#e0cdb0" stroke-width="3" stroke-dasharray="12 20"/>
  <circle cx="512" cy="512" r="280" fill="none" stroke="#e8d8c0" stroke-width="2" opacity="0.6"/>
  <!-- large italic R -->
  <text x="512" y="610"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="400"
    font-size="520"
    fill="url(#accentB)"
    filter="url(#shadowB)"
  >R</text>
  <!-- underline accent -->
  <rect x="260" y="680" width="504" height="12" rx="6" fill="#c4894a" opacity="0.5"/>
</svg>
